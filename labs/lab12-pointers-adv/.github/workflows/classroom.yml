name: Autograding Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc
    
    - name: Compile all source files
      run: |
        gcc src/ptr_array.c -o ptr_array -Wall -Wextra && echo "✅ ptr_array.c"
        gcc src/errors.c -o errors -Wall && echo "✅ errors.c"
        gcc src/challenge.c -o challenge -Wall -Wextra && echo "✅ challenge.c"
    
    - name: Test ptr_array.c
      run: |
        OUTPUT=$(./ptr_array)
        echo "$OUTPUT"
        PASS=0
        TOTAL=4
        
        if echo "$OUTPUT" | grep -q "總和: 150"; then
          echo "✅ array_sum 正確"
          PASS=$((PASS+1))
        else
          echo "❌ array_sum 不正確"
        fi
        
        if echo "$OUTPUT" | grep -q "反轉後.*5.*4.*3.*2.*1"; then
          echo "✅ ptr_reverse 正確"
          PASS=$((PASS+1))
        else
          echo "❌ ptr_reverse 不正確"
        fi
        
        if echo "$OUTPUT" | grep -q "該位置的值: 30"; then
          echo "✅ ptr_find 正確"
          PASS=$((PASS+1))
        else
          echo "❌ ptr_find 不正確"
        fi
        
        if echo "$OUTPUT" | grep -q "複製結果.*100.*200.*300"; then
          echo "✅ ptr_copy 正確"
          PASS=$((PASS+1))
        else
          echo "❌ ptr_copy 不正確"
        fi
        
        echo ""
        echo "通過 $PASS / $TOTAL 項測試"
        if [ $PASS -lt 2 ]; then
          exit 1
        fi
    
    - name: Test challenge.c
      run: |
        OUTPUT=$(./challenge)
        echo "$OUTPUT"
        PASS=0
        TOTAL=3
        
        if echo "$OUTPUT" | grep -q "反轉後: olleH"; then
          echo "✅ my_strrev 正確"
          PASS=$((PASS+1))
        else
          echo "❌ my_strrev 不正確"
        fi
        
        if echo "$OUTPUT" | grep -q "合併結果.*1.*2.*3.*4.*5.*6.*7.*8.*9"; then
          echo "✅ merge_sorted 正確"
          PASS=$((PASS+1))
        else
          echo "❌ merge_sorted 不正確"
        fi
        
        if echo "$OUTPUT" | grep -q "找到: World"; then
          echo "✅ my_strstr 正確"
          PASS=$((PASS+1))
        else
          echo "❌ my_strstr 不正確"
        fi
        
        echo ""
        echo "通過 $PASS / $TOTAL 項挑戰測試"
    
    - name: Check answer files
      run: |
        if [ -f "error_answers.md" ]; then
          CONTENT=$(cat error_answers.md | grep -v "^#" | grep -v "^$" | grep -v "（你的答案）" | grep -v "在此")
          if [ -n "$CONTENT" ]; then
            echo "✅ error_answers.md 已填寫"
          else
            echo "⚠️ error_answers.md 似乎還沒填寫完成"
          fi
        else
          echo "❌ error_answers.md 不存在"
        fi
